<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════
//  RENDERER
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const R = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
const MAX_PR = Math.min(devicePixelRatio, 1.25);
let currentPR = MAX_PR;
R.setPixelRatio(currentPR);
R.setClearColor(0x000308, 1);
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFShadowMap;
R.shadowMap.autoUpdate = false;
R.shadowMap.needsUpdate = true;
R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 1.2;

const S = new THREE.Scene();
S.fog = new THREE.FogExp2(0x02121e, 0.024);

const cam = new THREE.PerspectiveCamera(72, 1, 0.3, 250);
cam.position.set(0, 1.7, 22);
let yaw = Math.PI, pitch = 0.06;

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════
function yieldToBrowser(){ return new Promise(r => setTimeout(r, 0)); }
const loadingEl = document.getElementById('loading');
const loadingMsg = loadingEl.querySelector('.msg');
function setLoadingMsg(msg){ loadingMsg.textContent = msg; }

function mergeGeometries(geoms){
  let totalVerts = 0, totalIndices = 0, hasUV = true, hasNormal = true;
  for (const g of geoms){
    totalVerts += g.attributes.position.count;
    totalIndices += g.index ? g.index.count : g.attributes.position.count;
    if (!g.attributes.uv) hasUV = false;
    if (!g.attributes.normal) hasNormal = false;
  }
  if (totalVerts === 0) return new THREE.BufferGeometry();
  const positions = new Float32Array(totalVerts * 3);
  const normals = hasNormal ? new Float32Array(totalVerts * 3) : null;
  const uvs = hasUV ? new Float32Array(totalVerts * 2) : null;
  const indices = totalVerts > 65535 ? new Uint32Array(totalIndices) : new Uint16Array(totalIndices);
  let vOff = 0, iOff = 0;
  for (const g of geoms){
    positions.set(g.attributes.position.array, vOff * 3);
    if (hasNormal && g.attributes.normal) normals.set(g.attributes.normal.array, vOff * 3);
    if (hasUV && g.attributes.uv) uvs.set(g.attributes.uv.array, vOff * 2);
    if (g.index){
      const idx = g.index.array;
      for (let i = 0; i < idx.length; i++) indices[iOff + i] = idx[i] + vOff;
      iOff += idx.length;
    } else {
      for (let i = 0; i < g.attributes.position.count; i++) indices[iOff + i] = i + vOff;
      iOff += g.attributes.position.count;
    }
    vOff += g.attributes.position.count;
  }
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  if (hasNormal) merged.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  if (hasUV) merged.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  merged.setIndex(new THREE.BufferAttribute(indices, 1));
  return merged;
}

function bakeAndMerge(meshes){
  const geoms = [];
  for (const m of meshes){
    m.updateMatrix();
    const g = m.geometry.clone();
    g.applyMatrix4(m.matrix);
    geoms.push(g);
  }
  return mergeGeometries(geoms);
}

// ═══════════════════════════════════════════════════════════════
//  TEXTURES
// ═══════════════════════════════════════════════════════════════
function makeRockMaps(){
  const SIZE = 512;
  const cd = document.createElement('canvas'); cd.width = cd.height = SIZE;
  const x = cd.getContext('2d');
  const base = x.createLinearGradient(0, 0, SIZE, SIZE);
  base.addColorStop(0, '#181622'); base.addColorStop(0.5, '#221e2e'); base.addColorStop(1, '#151320');
  x.fillStyle = base; x.fillRect(0, 0, SIZE, SIZE);
  for (let i = 0; i < 20; i++){
    x.strokeStyle = `rgba(${60+Math.random()*80},${80+Math.random()*90},${140+Math.random()*100},${0.08+Math.random()*0.18})`;
    x.lineWidth = 0.5 + Math.random()*2; x.beginPath();
    let px = Math.random()*SIZE, py = Math.random()*SIZE; x.moveTo(px, py);
    for (let j = 0; j < 5; j++){ px += (Math.random()-0.5)*160; py += (Math.random()-0.5)*160; x.lineTo(px, py); }
    x.stroke();
  }
  for (let i = 0; i < 150; i++){
    const px = Math.random()*SIZE, py = Math.random()*SIZE, r = 15 + Math.random()*70;
    const v = 18 + Math.random()*40;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, `rgba(${v},${v+8},${v+20},${0.3+Math.random()*0.4})`);
    g.addColorStop(1, `rgba(${v},${v+8},${v+20},0)`);
    x.fillStyle = g; x.fillRect(px-r, py-r, r*2, r*2);
  }
  for (let i = 0; i < 30; i++){
    x.strokeStyle = `rgba(3,2,8,${0.6+Math.random()*0.35})`;
    x.lineWidth = 0.5 + Math.random()*2; x.lineCap = 'round'; x.beginPath();
    let px = Math.random()*SIZE, py = Math.random()*SIZE; x.moveTo(px, py);
    for (let j = 0; j < 5; j++){ px += (Math.random()-0.5)*80; py += (Math.random()-0.5)*80; x.lineTo(px, py); }
    x.stroke();
  }
  for (let i = 0; i < 2000; i++){
    const px = Math.random()*SIZE, py = Math.random()*SIZE, r = 0.3 + Math.random()*1.2;
    const v = Math.random() < 0.5 ? 3 + Math.random()*10 : 50 + Math.random()*40;
    x.fillStyle = `rgba(${v},${v+2},${v+8},${0.4+Math.random()*0.5})`;
    x.beginPath(); x.arc(px, py, r, 0, Math.PI*2); x.fill();
  }
  const cb = document.createElement('canvas'); cb.width = cb.height = SIZE;
  const xb = cb.getContext('2d');
  xb.fillStyle = '#808080'; xb.fillRect(0, 0, SIZE, SIZE);
  xb.strokeStyle = '#1a1a1a';
  for (let i = 0; i < 30; i++){
    xb.lineWidth = 1 + Math.random()*2.5; xb.beginPath();
    let px = Math.random()*SIZE, py = Math.random()*SIZE; xb.moveTo(px, py);
    for (let j = 0; j < 5; j++){ px += (Math.random()-0.5)*80; py += (Math.random()-0.5)*80; xb.lineTo(px, py); }
    xb.stroke();
  }
  const tD = new THREE.CanvasTexture(cd); tD.wrapS = tD.wrapT = THREE.RepeatWrapping; tD.anisotropy = 4; tD.encoding = THREE.sRGBEncoding;
  const tB = new THREE.CanvasTexture(cb); tB.wrapS = tB.wrapT = THREE.RepeatWrapping; tB.anisotropy = 4;
  return {diffuse: tD, bump: tB};
}
function makeFloorMaps(){
  const SIZE = 512;
  const cd = document.createElement('canvas'); cd.width = cd.height = SIZE;
  const x = cd.getContext('2d');
  x.fillStyle = '#161420'; x.fillRect(0, 0, SIZE, SIZE);
  for (let i = 0; i < 200; i++){
    const px = Math.random()*SIZE, py = Math.random()*SIZE, r = 15 + Math.random()*50;
    const v = 20 + Math.random()*35;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, `rgba(${v},${v+3},${v+12},0.4)`);
    g.addColorStop(1, `rgba(${v},${v+3},${v+12},0)`);
    x.fillStyle = g; x.fillRect(px-r, py-r, r*2, r*2);
  }
  for (let i = 0; i < 800; i++){
    const px = Math.random()*SIZE, py = Math.random()*SIZE, r = 1 + Math.random()*3;
    const v = 25 + Math.random()*50;
    const g = x.createRadialGradient(px-r*0.3, py-r*0.3, 0, px, py, r);
    g.addColorStop(0, `rgba(${v+30},${v+35},${v+45},0.7)`);
    g.addColorStop(0.6, `rgba(${v},${v+3},${v+10},0.5)`);
    g.addColorStop(1, `rgba(${v-10},${v-8},${v},0)`);
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, Math.PI*2); x.fill();
  }
  const cb = document.createElement('canvas'); cb.width = cb.height = SIZE;
  const xb = cb.getContext('2d');
  xb.fillStyle = '#606060'; xb.fillRect(0, 0, SIZE, SIZE);
  for (let i = 0; i < 800; i++){
    const px = Math.random()*SIZE, py = Math.random()*SIZE, r = 1 + Math.random()*4;
    const g = xb.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(220,220,220,0.9)');
    g.addColorStop(1, 'rgba(80,80,80,0)');
    xb.fillStyle = g; xb.beginPath(); xb.arc(px, py, r, 0, Math.PI*2); xb.fill();
  }
  const tD = new THREE.CanvasTexture(cd); tD.wrapS = tD.wrapT = THREE.RepeatWrapping; tD.anisotropy = 4; tD.encoding = THREE.sRGBEncoding;
  const tB = new THREE.CanvasTexture(cb); tB.wrapS = tB.wrapT = THREE.RepeatWrapping; tB.anisotropy = 4;
  return {diffuse: tD, bump: tB};
}
function makeCrystalEnv(){
  const size = 256, faces = [];
  for (let i = 0; i < 6; i++){
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#020810'; x.fillRect(0, 0, size, size);
    for (let j = 0; j < 20; j++){
      const px = Math.random()*size, py = Math.random()*size, r = 4 + Math.random()*25;
      const g = x.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, 'rgba(150,220,255,1)');
      g.addColorStop(0.3, 'rgba(100,180,255,0.55)');
      g.addColorStop(1, 'rgba(30,80,160,0)');
      x.fillStyle = g; x.fillRect(px-r, py-r, r*2, r*2);
    }
    faces.push(c);
  }
  const t = new THREE.CubeTexture(faces); t.needsUpdate = true; t.encoding = THREE.sRGBEncoding;
  return t;
}
function makeWaterNormal(){
  const SIZE = 256;
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const x = c.getContext('2d');
  const img = x.createImageData(SIZE, SIZE);
  for (let py = 0; py < SIZE; py++){
    for (let px = 0; px < SIZE; px++){
      const u = px / SIZE * Math.PI * 2, v = py / SIZE * Math.PI * 2;
      const nx = Math.sin(u*3)*Math.cos(v*2)*0.4 + Math.sin(u*7+v*3)*0.25;
      const ny = Math.cos(v*3)*Math.sin(u*2)*0.4 + Math.cos(v*8-u*4)*0.25;
      const i = (py*SIZE + px) * 4;
      img.data[i] = 128 + nx*110; img.data[i+1] = 128 + ny*110;
      img.data[i+2] = 255; img.data[i+3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
  return t;
}
function makeDustSprite(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(220,240,255,1)');
  g.addColorStop(0.3, 'rgba(160,210,255,0.6)');
  g.addColorStop(1, 'rgba(80,150,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
function makeGlowSprite(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(120,220,255,0.9)');
  g.addColorStop(0.3, 'rgba(80,180,255,0.4)');
  g.addColorStop(1, 'rgba(30,80,180,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
let elapsed = 0, frameCount = 0;
let crystalLight, crystalLight2, crystalHalo, crystalMat;
let waterNormal, waterMesh, treePond;
let beamCone, holeGlow, treeBeamCone, treeHoleGlow;
let mushroomCapMat, runeMat;
let treeGroup, treeLeafWorld = [], treePondCenter;
let floatLightGeo, floatLightData, floatLightCount, floatPointLights = [];
let dustGeo, dustData, dustCount;
let wispGeo, wispData, wispCount;
let rippleInst, rippleData = [], rippleMax = 24, rippleCursor = 0;
let treeDrops = [];
let dropGeo, dropMat;
let nextDropTime = 0;
const DROP_MIN = 0.5, DROP_MAX = 1.5;
let audioCtx = null;
let computerWorldPos = null;
let updateHQ = null, computerNear = false, updateComputer = null, deskRef = null, screenSet = null;
const ray = new THREE.Raycaster();
let tapX = 0, tapY = 0;

// ═══════════════════════════════════════════════════════════════
//  BUILD CAVE
// ═══════════════════════════════════════════════════════════════
async function buildCave(){
  setLoadingMsg('توليد النسيج...');
  await yieldToBrowser();
  const rockMaps = makeRockMaps();
  const floorMaps = makeFloorMaps();
  await yieldToBrowser();

  setLoadingMsg('إنشاء البيئة...');
  const crystalEnv = makeCrystalEnv();
  waterNormal = makeWaterNormal();
  const dustTex = makeDustSprite();
  const glowTex = makeGlowSprite();
  await yieldToBrowser();

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function initAudio(){
  if (audioCtx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const sh = document.getElementById('snd-hint');
    sh.textContent = '🔊 الصوت يعمل';
    setTimeout(() => { sh.style.opacity = '0'; }, 3000);
  } catch(e){}
}
['pointerdown', 'keydown', 'touchstart'].forEach(evt => window.addEventListener(evt, initAudio));

function playDripSound(vol){
  if (!audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'sine';
  const baseFreq = 900 + Math.random() * 700;
  osc.frequency.setValueAtTime(baseFreq, now);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.35, now + 0.12);
  filter.type = 'lowpass'; filter.frequency.value = 3500;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.22);
}

function spawnDrop(){

  const m = t.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/), l = t.match(/[?&]list=([\w-]+)/);
  if (m) return {id:m[1], list:l && l[1]};
  if (/^(?=.*[\dA-Z_-])[\w-]{11}$/.test(t)) return {id:t};
  if (l) return {list:l[1]};
  return null;
}
function recents(){ try { return JSON.parse(localStorage.getItem('cave_yt')||'[]'); } catch(e){ return []; } }
function saveRecent(id){
  try { const r = recents().filter(x => x.id !== id); r.unshift({id, t:''}); localStorage.setItem('cave_yt', JSON.stringify(r.slice(0,12))); } catch(e){}
  drawRecents();
}
function drawRecents(){
  recentEl.innerHTML = '';
  recents().forEach(x => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<img loading="lazy" src="https://i.ytimg.com/vi/'+x.id+'/mqdefault.jpg"><span>'+(x.t||x.id)+'</span>';
    c.onclick = () => playYT({id:x.id});
    recentEl.appendChild(c);
    if (!x.t) fetch('https://noembed.com/embed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+x.id)).then(r => r.json()).then(j => {
      if (!j.title) return; c.lastChild.textContent = j.title;
      try { const r = recents(); const i = r.findIndex(y => y.id === x.id); if (i > -1){ r[i].t = j.title; localStorage.setItem('cave_yt', JSON.stringify(r)); } } catch(e){}
    }).catch(()=>{});
  });
}
function playYT(p){
  cur = p;
  const o = location.protocol.startsWith('http') ? '&origin='+encodeURIComponent(location.origin) : '';
  const q = 'autoplay=1&playsinline=1&rel=0&modestbranding=1'+o;
  const src = p.id ? 'https://www.youtube-nocookie.com/embed/'+p.id+'?'+q+(p.list?'&list='+p.list:'') : 'https://www.youtube-nocookie.com/embed/videoseries?list='+p.list+'&'+q;
  player.innerHTML = '';
  const hosts = ['yewtu.be','inv.nadeko.net'];
  const f = document.createElement('iframe'); f.src = (altN && p.id) ? 'https://'+hosts[(altN-1)%2]+'/embed/'+p.id+'?autoplay=1' : src; f.allowFullscreen = true;
  f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media; accelerometer; gyroscope';
  f.referrerPolicy = 'strict-origin-when-cross-origin'; player.appendChild(f);
  if (p.id) saveRecent(p.id);
}
const msg = t => { $('bw-msg').textContent = t; };
const SRC = [['p','pipedapi.kavin.rocks'],['p','api.piped.private.coffee'],['i','yewtu.be'],['i','inv.nadeko.net']];
let altN = 0;
async function searchYT(q){
  msg('⏳ جارٍ البحث…'); recentEl.innerHTML = '';
  for (const [k, h] of SRC){
    try {
      const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 6000);
      const r = await fetch(k === 'p' ? 'https://'+h+'/search?q='+encodeURIComponent(q)+'&filter=videos' : 'https://'+h+'/api/v1/search?q='+encodeURIComponent(q)+'&type=video', {signal:ac.signal});
      clearTimeout(tm); const j = await r.json();
      const list = (k === 'p' ? j.items : j).map(x => ({id: k === 'p' ? (x.url||'').split('v=')[1] : x.videoId, t: x.title})).filter(x => x.id).slice(0, 12);
      if (!list.length) continue;
      msg(''); list.forEach(x => { const c = document.createElement('div'); c.className = 'card';
        c.innerHTML = '<img src="https://i.ytimg.com/vi/'+x.id+'/mqdefault.jpg"><span></span>'; c.lastChild.textContent = x.t; c.onclick = () => playYT({id:x.id}); recentEl.appendChild(c); });
      return;
    } catch(e){}
  }
  msg('تعذّر البحث داخل الكهف (الخوادم مشغولة). افتح البحث في يوتيوب، ثم الصق رابط الفيديو هنا.'); drawRecents();
}
function setTab(t){
  tab = t; $('pane-files').style.display = t === 'files' ? 'flex' : 'none'; $('tab-files').classList.toggle('on', t === 'files'); $('pane-yt').style.display = t === 'yt' ? 'flex' : 'none'; $('pane-web').style.display = t === 'web' ? 'flex' : 'none';
  $('tab-yt').classList.toggle('on', t === 'yt'); $('tab-web').classList.toggle('on', t === 'web');
  if (t === 'web' && !webLoaded){ webLoaded = true; browserFrame.src = 'https://ar.m.wikipedia.org'; }
}
function navigate(){
  const v = browserUrl.value.trim(); if (!v) return;
  if (tab === 'yt'){
    const p = parseYT(v);
    if (p) playYT(p); else searchYT(v);
  } else { let u = /^https?:\/\//.test(v) ? v : (v.includes('.') && !v.includes(' ') ? 'https://'+v : 'https://ar.m.wikipedia.org/w/index.php?search='+encodeURIComponent(v));
    let px = ''; try { px = localStorage.getItem('cave_px') || ''; } catch(e){}
    if (px && /wikipedia\.org\/w\/index\.php\?search=/.test(u)) u = 'https://html.duckduckgo.com/html/?q='+encodeURIComponent(v);
    browserFrame.src = px ? px.replace(/\/$/, '')+'/?url='+encodeURIComponent(u) : u; }
}
function openBrowser(){
  browserOverlay.style.display = 'flex'; browserOverlay.style.pointerEvents = 'auto';
  drawRecents(); if (!matchMedia('(pointer:coarse)').matches) setTimeout(() => browserUrl.focus(), 150);
}
function closeBrowser(){
  browserOverlay.style.display = 'none'; browserOverlay.style.pointerEvents = 'none';
  player.innerHTML = 'الصق رابط فيديو يوتيوب في الأعلى ثم اضغط ▶'; cur = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
const vid = document.createElement('video'); vid.playsInline = true; vid.controls = true; vid.loop = true;
let curKind = null, curImg = null; const view = $('bw-view'), filesEl = $('files');
$('tab-files').onclick = () => setTab('files'); $('bw-pick').onclick = () => $('bw-input').click();
let list = [], idx = 0;
$('bw-input').onchange = e => { filesEl.innerHTML = ''; list = [];
  [...e.target.files].forEach(f => { const url = URL.createObjectURL(f), isV = f.type.startsWith('video') ? 'video' : f.type.startsWith('audio') ? 'audio' : '', c = document.createElement('div'); c.className = 'card';
    c.innerHTML = isV === 'audio' ? '<div style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:34px">🎵</div><span></span>' : isV ? '<video src="'+url+'#t=0.5" preload="metadata" muted playsinline style="width:100%;aspect-ratio:16/9;object-fit:cover"></video>' : '<img src="'+url+'">';
    if (isV === 'audio') c.lastChild.textContent = f.name;
    c.onclick = () => { idx = list.findIndex(m => m.url === url); showMedia(isV, url, f.name); sendNow(); }; filesEl.appendChild(c); list.push({isV, url, name:f.name}); });
  if (list.length){ idx = 0; showMedia(list[0].isV, list[0].url, list[0].name); sendNow(); } };
let curName = '';
function showMedia(isV, url, name){
  curName = (name || '').replace(/\.[^.]+$/, '');
  view.innerHTML = '';
  if (isV){ vid.src = url; vid.play().catch(()=>{}); view.appendChild(vid); }
  else { vid.pause(); const im = new Image(); im.src = url; im.style.cssText = 'max-width:100%;max-height:55vh'; view.appendChild(im); curImg = im; }
  curKind = isV || 'image';
}
function sendNow(){
  if (!curKind) return; const k = curKind, go = () => { if (screenSet) screenSet(k, k === 'image' ? curImg : vid); closeBrowser(); };
  if (k === 'image' && !curImg.complete) curImg.onload = go; else go(); }
function step(d){ if (list.length < 2) return; idx = (idx + d + list.length) % list.length; showMedia(list[idx].isV, list[idx].url, list[idx].name); sendNow(); }
$('bw-send').onclick = sendNow;
$('mprev').onclick = () => step(-1); $('mnext').onclick = () => step(1);
setInterval(() => { $('mnav').style.display = (computerNear && list.length > 1 && browserOverlay.style.display === 'none') ? 'flex' : 'none'; }, 400);
$('bw-ui').onclick = () => { vid.pause(); if (screenSet) screenSet('ui'); };
$('tab-yt').onclick = () => setTab('yt'); $('tab-web').onclick = () => setTab('web');
$('bw-ext').onclick = () => { const v = browserUrl.value.trim(); const p = cur || parseYT(v);
  window.open(p && p.id ? 'https://www.youtube.com/watch?v='+p.id : 'https://www.youtube.com/results?search_query='+encodeURIComponent(v), '_blank'); };
$('bw-aj').onclick = () => { setTab('yt'); browserUrl.value = 'الجزيرة مباشر بث مباشر'; searchYT(browserUrl.value); };
$('bw-search').onclick = () => window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(browserUrl.value.trim()), '_blank');
$('bw-alt').onclick = () => { if (!cur) return msg('شغّل فيديو أولاً'); altN = (altN + 1) % 3; playYT(cur); msg(altN ? 'مشغّل بديل '+altN : 'مشغّل يوتيوب الأصلي'); };
$('bw-proxy').onclick = () => { const v = prompt('رابط بروكسي Cloudflare Worker الخاص بك (فارغ للإلغاء):', localStorage.getItem('cave_px')||''); if (v !== null){ try { localStorage.setItem('cave_px', v.trim()); } catch(e){} } };
$('bw-fs').onclick = () => { const e = player; (e.requestFullscreen ? e.requestFullscreen() : Promise.reject()).then(() => { try { screen.orientation.lock('landscape').catch(()=>{}); } catch(x){} }).catch(()=>{}); };
browserGo.addEventListener('click', navigate);
browserUrl.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); navigate(); } });
browserClose.addEventListener('click', closeBrowser);
interactBtn.addEventListener('click', openBrowser);

// ═══════════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════════
let joyX = 0, joyY = 0;
const keys = {};
const PLAYER_HEIGHT = 1.7, SPEED = 6;
const joyEl = document.getElementById('joy');
const joyKnob = document.getElementById('joy-knob');
let joyId = null, joyStartX = 0, joyStartY = 0;

joyEl.addEventListener('pointerdown', e => {
  e.preventDefault(); if (joyId !== null) return;
  joyId = e.pointerId;
  const r = joyEl.getBoundingClientRect();
  joyStartX = r.left + r.width/2; joyStartY = r.top + r.height/2;
  updateJoy(e.clientX, e.clientY);
  joyEl.setPointerCapture(e.pointerId);
});
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) updateJoy(e.clientX, e.clientY); });
function endJoy(e){ if (e.pointerId !== joyId) return; joyId = null; joyX = joyY = 0; joyKnob.style.transform = 'translate(0, 0)'; }
joyEl.addEventListener('pointerup', endJoy);
joyEl.addEventListener('pointercancel', endJoy);
function updateJoy(cx, cy){
  let dx = cx - joyStartX, dy = cy - joyStartY;
  const dist = Math.sqrt(dx*dx + dy*dy), maxR = 40;
  if (dist > maxR){ dx = dx/dist*maxR; dy = dy/dist*maxR; }
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  joyX = dx/maxR; joyY = dy/maxR;
}
let lookId = null, lookX = 0, lookY = 0;
canvas.addEventListener('pointerdown', e => {
  if (browserOverlay.style.display !== 'none') return;
  const r = joyEl.getBoundingClientRect();
  if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) return;
  lookId = e.pointerId; lookX = tapX = e.clientX; lookY = tapY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== lookId) return;
  yaw -= (e.clientX - lookX) * 0.005;
  pitch -= (e.clientY - lookY) * 0.005;
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
  lookX = e.clientX; lookY = e.clientY;
});
function endLook(e){
  if (e.pointerId !== lookId) return; lookId = null;
  if (e.type === 'pointerup' && computerNear && deskRef && Math.hypot(e.clientX-tapX, e.clientY-tapY) < 8){
    ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), cam);
    if (ray.intersectObject(deskRef, true).length) openBrowser();
  }
}
canvas.addEventListener('pointerup', endLook);
canvas.addEventListener('pointercancel', endLook);
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE' && computerNear && browserOverlay.style.display === 'none'){
    e.preventDefault(); openBrowser();
  }
  if (e.code === 'Escape' && browserOverlay.style.display !== 'none'){
    e.preventDefault(); closeBrowser();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

setTimeout(() => {
  const h = document.getElementById('hint'); if (h) h.style.opacity = '0';
}, 5000);
function resize(){
  const w = innerWidth, h = innerHeight;
  R.setSize(w, h, false);
  cam.aspect = w/h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ═══════════════════════════════════════════════════════════════
//  FPS
// ═══════════════════════════════════════════════════════════════
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsTimer = 0, lowCount = 0;
function monitorFPS(dt){
  fpsFrames++; fpsTimer += dt;
  if (fpsTimer >= 0.5){
    const fps = Math.round(fpsFrames / fpsTimer);
    fpsEl.textContent = fps + ' FPS';
    fpsEl.style.color = fps >= 45 ? '#88ffcc' : fps >= 25 ? '#ffcc44' : '#ff6666';
    if (fps < 25 && currentPR > 0.75){
      lowCount++;
      if (lowCount >= 3){
        currentPR = Math.max(0.75, currentPR - 0.25);
        R.setPixelRatio(currentPR);
        R.setSize(innerWidth, innerHeight, false);
        lowCount = 0;
      }
    } else lowCount = 0;
    fpsFrames = 0; fpsTimer = 0;
  }
}

// ═══════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════
const dummyObj = new THREE.Object3D();
const CAVE_R = 30, CRYSTAL_AVOID = 5;
let loadingHidden = false;

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  frameCount++;
  monitorFPS(dt);

  if (browserOverlay.style.display !== 'none') return; // نوفّر الأداء أثناء المشاهدة

  // Player movement
  const browserOpen = browserOverlay.style.display !== 'none';
  if (!browserOpen){
    let mf = -joyY, mr = joyX;
    if (keys['KeyW'] || keys['ArrowUp']) mf += 1;
    if (keys['KeyS'] || keys['ArrowDown']) mf -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mr += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mr -= 1;
    const mag = Math.sqrt(mf*mf + mr*mr);
    if (mag > 1){ mf /= mag; mr /= mag; }
    if (mf !== 0 || mr !== 0){
      const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const np = cam.position.clone();
      np.addScaledVector(fwd, mf * SPEED * dt);
      np.addScaledVector(rgt, mr * SPEED * dt);
      np.y = PLAYER_HEIGHT;
      const d = Math.sqrt(np.x*np.x + np.z*np.z);
      if (d > CAVE_R){ const a = Math.atan2(np.z, np.x); np.x = Math.cos(a)*CAVE_R; np.z = Math.sin(a)*CAVE_R; }
      if (d < CRYSTAL_AVOID){ const a = Math.atan2(np.z, np.x); np.x = Math.cos(a)*CRYSTAL_AVOID; np.z = Math.sin(a)*CRYSTAL_AVOID; }
      cam.position.copy(np);
    }
    const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
    cam.quaternion.setFromEuler(euler);
  }

  // Computer proximity
  if (computerWorldPos){
    const d2 = cam.position.distanceTo(computerWorldPos);
    const wasNear = computerNear;
    computerNear = d2 < 5;
    if (computerNear && !wasNear && !browserOpen) interactBtn.style.display = 'block';
    if ((!computerNear || browserOpen) && interactBtn.style.display !== 'none') interactBtn.style.display = 'none';
  }

  // Animations
  if (crystalLight){
    const pulse = 0.7 + Math.sin(elapsed * 1.2) * 0.3;
    crystalLight.intensity = 9 + pulse * 5;
    crystalLight2.intensity = 3 + pulse * 2;
    crystalMat.emissiveIntensity = 0.6 + pulse * 0.4;
    crystalHalo.material.opacity = 0.5 + pulse * 0.25;
    crystalHalo.scale.setScalar(20 + pulse * 6);
  }
  if (runeMat) runeMat.opacity = 0.25 + Math.sin(elapsed * 2) * 0.25;
  if (mushroomCapMat) mushroomCapMat.emissiveIntensity = 1.2 + Math.sin(elapsed * 1.5) * 0.4;

  if (waterNormal){
    waterNormal.offset.x = elapsed * 0.012;
    waterNormal.offset.y = elapsed * 0.007;
    waterMesh.position.y = -0.35 + Math.sin(elapsed * 0.6) * 0.015;
    treePond.position.y = -0.2 + Math.sin(elapsed * 0.7) * 0.008;
  }

  if (dustGeo){
    const dp = dustGeo.attributes.position.array;
    for (let i = 0; i < dustCount; i++){
      const d = dustData[i];
      const t = elapsed * d.speed + d.phase;
      dp[i*3+1] = d.baseY + Math.sin(t) * d.radius;
      dp[i*3] += d.driftX * dt; dp[i*3+2] += d.driftZ * dt;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }

  if (wispGeo){
    const wp = wispGeo.attributes.position.array;
    for (let i = 0; i < wispCount; i++){
      const w = wispData[i];
      w.angle += w.speed * dt * 0.4;
      wp[i*3] = Math.cos(w.angle)*w.radius + Math.sin(elapsed*0.7+w.yPhase)*1.5;
      wp[i*3+1] = w.yBase + Math.sin(elapsed*0.9+w.yPhase)*1.5;
      wp[i*3+2] = Math.sin(w.angle)*w.radius + Math.cos(elapsed*0.6+w.yPhase)*1.5;
    }
    wispGeo.attributes.position.needsUpdate = true;
  }

  if (floatLightGeo){
    const flp = floatLightGeo.attributes.position.array;
    for (let i = 0; i < floatLightCount; i++){
      const u = floatLightData[i];
      const t = elapsed * u.speed + u.phase;
      flp[i*3] = u.baseX + Math.sin(t + u.phaseX) * u.radius;
      flp[i*3+1] = u.baseY + Math.sin(t * 0.7 + u.phaseY) * u.radius * 0.6;
      flp[i*3+2] = u.baseZ + Math.cos(t + u.phaseZ) * u.radius;
    }
    floatLightGeo.attributes.position.needsUpdate = true;
    floatPointLights.forEach(fl => {
      const idx = fl.idx;
      fl.light.position.set(flp[idx*3], flp[idx*3+1], flp[idx*3+2]);
      fl.light.intensity = 0.35 + Math.sin(elapsed * 2 + idx) * 0.25;
    });
  }

  if (treeGroup && treeLeafWorld.length > 0){
    if (elapsed > nextDropTime){
      spawnDrop();
      nextDropTime = elapsed + DROP_MIN + Math.random() * (DROP_MAX - DROP_MIN);
    }
    const distToTree = cam.position.distanceTo(treeGroup.position);
    const proximity = Math.max(0, 1 - distToTree / 30);
    for (let i = treeDrops.length - 1; i >= 0; i--){
      const d = treeDrops[i];
      const u = d.userData;
      u.vy -= 18 * dt;
      d.position.y += u.vy * dt;
      if (d.position.y <= treePondCenter.y + 0.05){
        const dx = d.position.x - treePondCenter.x;
        const dz = d.position.z - treePondCenter.z;
        if (Math.sqrt(dx*dx+dz*dz) < 6){
          const idx = rippleCursor;
          rippleCursor = (rippleCursor + 1) % rippleMax;
          const r = rippleData[idx];
          r.active = true; r.life = 0;
          r.x = d.position.x; r.y = treePondCenter.y + 0.02; r.z = d.position.z;
          if (proximity > 0.03) playDripSound(proximity * proximity * 0.13);
        }
        S.remove(d); treeDrops.splice(i, 1);
      } else if (d.position.y < -1){
        S.remove(d); treeDrops.splice(i, 1);
      }
    }
  }

  if (rippleInst){
    for (let i = 0; i < rippleMax; i++){
      const r = rippleData[i];
      dummyObj.rotation.set(-Math.PI/2, 0, 0);
      if (!r.active){
        dummyObj.position.set(0, -1000, 0);
        dummyObj.scale.setScalar(0.001);
        dummyObj.updateMatrix();
        rippleInst.setMatrixAt(i, dummyObj.matrix);
        continue;
      }
      r.life += dt;
      const t = r.life / r.maxLife;
      if (t >= 1){
        r.active = false;
        dummyObj.position.set(0, -1000, 0);
        dummyObj.scale.setScalar(0.001);
      } else {
        const eased = 1 - Math.pow(1 - t, 2.5);
        dummyObj.position.set(r.x, r.y, r.z);
        dummyObj.scale.setScalar(0.1 + eased * 3.2);
      }
      dummyObj.updateMatrix();
      rippleInst.setMatrixAt(i, dummyObj.matrix);
    }
    rippleInst.instanceMatrix.needsUpdate = true;
  }

  if (beamCone){
    beamCone.material.opacity = 0.06 + Math.sin(elapsed * 0.7) * 0.015;
    holeGlow.material.opacity = 0.75 + Math.sin(elapsed * 0.5) * 0.15;
    treeBeamCone.material.opacity = 0.05 + Math.sin(elapsed * 0.9) * 0.012;
    treeHoleGlow.material.opacity = 0.7 + Math.sin(elapsed * 0.6) * 0.12;
  }

  if (updateComputer) updateComputer(elapsed, dt);
  if (updateHQ) updateHQ(elapsed, dt);
  if (royalUpdate) royalUpdate(elapsed, dt);
  R.render(S, cam);

  if (!loadingHidden && frameCount >= 2){
    loadingHidden = true;
    loadingEl.classList.add('hidden');
    setTimeout(() => { loadingEl.style.display = 'none'; }, 800);
  }
}

// ═══════════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════════
buildCave().then(() => { loop(); }).catch(err => {
  console.error('Build failed:', err);
  setLoadingMsg('خطأ: ' + err.message);
});
})();
